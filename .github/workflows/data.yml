# Keeps data/ loadable by the page without any API calls:
#  - data/oracle-cards-*.jsonl.gz: Scryfall Oracle Cards, refreshed weekly (and on demand), cut to the fields the page reads
#  - data/aliases.json: alternate printed names (Universes Beyond flavour names) mapped to Oracle names, from Default Cards
#  - data/spellbook/: Commander Spellbook combos, rebuilt weekly (and on demand) from variants.json into small files
#  - data/index.json: list of files in data/, rebuilt after every push that touches data/
name: Data files
on:
  schedule:
    - cron: '23 6 * * 1'          # Mondays 06:23 UTC: refresh Scryfall card data and Commander Spellbook
  workflow_dispatch:
    inputs:
      scryfall:
        description: 'Refresh Scryfall card data'
        type: boolean
        default: true
      scryfall_force:
        description: 'Re-download Scryfall card data even if the file is current'
        type: boolean
        default: false
      spellbook:
        description: 'Refresh Commander Spellbook combos'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/data.yml'
permissions:
  contents: write
concurrency:
  group: data-files
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download and split Commander Spellbook variants.json
        # Scheduled and manual runs refresh; a push refreshes only when the converter or this workflow changed,
        # or when no Spellbook files exist yet.
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REFRESH: ${{ github.event.inputs.spellbook }}
        run: |
          run=no
          if [ "$EVENT" = schedule ]; then run=yes; fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$REFRESH" != false ]; then run=yes; fi
          if [ "$EVENT" = push ]; then
            if [ ! -f data/spellbook/manifest.json ]; then run=yes
            elif git diff --name-only "$BEFORE" HEAD 2>/dev/null | grep -qE '^(tools/spellbook-shard\.js|\.github/workflows/data\.yml)$'; then run=yes; fi
          fi
          echo "Refresh Spellbook: $run"
          [ "$run" = yes ] || exit 0
          curl -fsSL --retry 4 --retry-delay 10 --compressed -o "$RUNNER_TEMP/variants.json" https://json.commanderspellbook.com/variants.json
          ls -l "$RUNNER_TEMP/variants.json"
          node tools/spellbook-shard.js "$RUNNER_TEMP/variants.json" data/spellbook
      - name: Download and slim Scryfall Oracle Cards
        # Scheduled and manual runs check Scryfall's bulk-data list; a push does so only when no card file exists yet.
        # A new file is written only when Scryfall has published a newer one; the old file is removed.
        # Scryfall's bulk-data entry names the file in jsonl_download_uri (.jsonl.gz) or, formerly, download_uri (.json).
        env:
          EVENT: ${{ github.event_name }}
          REFRESH: ${{ github.event.inputs.scryfall }}
          FORCE: ${{ github.event.inputs.scryfall_force }}
        run: |
          run=no
          if [ "$EVENT" = schedule ]; then run=yes; fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$REFRESH" != false ]; then run=yes; fi
          if [ "$EVENT" = push ] && ! ls data/oracle-cards-*.jsonl.gz >/dev/null 2>&1; then run=yes; fi
          echo "Refresh Scryfall: $run"
          [ "$run" = yes ] || exit 0
          trap 'echo "::error::Scryfall refresh failed at line $LINENO"' ERR
          UA='broken-stuff-edh-generator/1.0 (GitHub Action; https://github.com/broken-stuff/edh-generator)'
          curl -sSL --retry 4 --retry-delay 10 -H "User-Agent: $UA" -H 'Accept: application/json;q=0.9,*/*;q=0.8' -o "$RUNNER_TEMP/bulk.json" -w '%{http_code}' https://api.scryfall.com/bulk-data/oracle-cards > "$RUNNER_TEMP/code" || true
          echo "::notice::Scryfall bulk-data HTTP $(cat "$RUNNER_TEMP/code"): $(head -c 300 "$RUNNER_TEMP/bulk.json" | tr '\n' ' ')"
          url=$(node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(j.jsonl_download_uri||j.download_uri)' "$RUNNER_TEMP/bulk.json")
          name=$(basename "$url" | sed -E 's/\.jsonl?(\.gz)?$//')   # e.g. oracle-cards-20261016090200
          echo "::notice::Newest Scryfall file: $url"
          case "$name" in oracle-cards-[0-9]*) ;; *) echo "::error::Unexpected file name: $url"; exit 1;; esac
          if [ -f "data/$name.jsonl.gz" ] && [ "$FORCE" != true ]; then echo "::notice::Card data already current ($name)."; exit 0; fi
          curl -fsSL --retry 4 --retry-delay 10 --compressed -H "User-Agent: $UA" -o "$RUNNER_TEMP/oracle.json" "$url"
          echo "::notice::Downloaded $(stat -c %s "$RUNNER_TEMP/oracle.json") bytes; $(node tools/scryfall-slim.js "$RUNNER_TEMP/oracle.json" "$RUNNER_TEMP/$name.jsonl.gz")"
          git rm -q --ignore-unmatch data/oracle-cards-*.json data/oracle-cards-*.jsonl data/oracle-cards-*.json.gz data/oracle-cards-*.jsonl.gz
          mv "$RUNNER_TEMP/$name.jsonl.gz" data/
      - name: Card name aliases from Scryfall Default Cards
        # Same schedule as the card data; a push builds the file only when it is missing or the converter changed.
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REFRESH: ${{ github.event.inputs.scryfall }}
        run: |
          run=no
          if [ "$EVENT" = schedule ]; then run=yes; fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$REFRESH" != false ]; then run=yes; fi
          if [ "$EVENT" = push ]; then
            if [ ! -f data/aliases.json ]; then run=yes
            elif git diff --name-only "$BEFORE" HEAD 2>/dev/null | grep -qE '^tools/scryfall-aliases\.js$'; then run=yes; fi
          fi
          echo "Refresh aliases: $run"
          [ "$run" = yes ] || exit 0
          trap 'echo "::error::Alias refresh failed at line $LINENO"' ERR
          UA='broken-stuff-edh-generator/1.0 (GitHub Action; https://github.com/broken-stuff/edh-generator)'
          curl -fsSL --retry 4 --retry-delay 10 -H "User-Agent: $UA" -H 'Accept: application/json;q=0.9,*/*;q=0.8' -o "$RUNNER_TEMP/dbulk.json" https://api.scryfall.com/bulk-data/default-cards
          url=$(node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(j.jsonl_download_uri||j.download_uri)' "$RUNNER_TEMP/dbulk.json")
          echo "::notice::Default Cards file: $url"
          curl -fsSL --retry 4 --retry-delay 10 -H "User-Agent: $UA" -o "$RUNNER_TEMP/default.bin" "$url"
          echo "::notice::$(node tools/scryfall-aliases.js "$RUNNER_TEMP/default.bin" data/aliases.json)"
      - name: Index data/
        run: node tools/data-index.js data
      - name: Mechanics coverage report
        continue-on-error: true
        run: node tools/mech-report.js data --newest 300 | while IFS= read -r l; do echo "::notice::$l"; done
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "Update data files (card data, Spellbook combos, data index)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
