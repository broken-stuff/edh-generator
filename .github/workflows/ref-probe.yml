# Temporary: probes deck-data endpoints from a GitHub runner (the development environment cannot reach them).
name: Reference data probe
on:
  push:
    branches: [claude/project-thread-0j2kkg]
    paths: ['tools/ref-probe.js', '.github/workflows/ref-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/ref-probe.js
