<html lang="en">
<meta charset="utf-8">

<script>window.EDH_SITE = 1;</script>
<style>
/* Layout: dashboard. Header bar; left navigation rail; main column with KPI cards, a status strip and one page at a time.
   Flat white cards on a light grey field (dark: near-black field, charcoal cards). Under 900px the rail becomes a scrolling tab strip. */
:root{
  --fz:1;
  --bg:#f2f3f6; --card:#ffffff; --card-2:#f6f7f9; --field-in:#ffffff;
  --line:#e6e8ec; --line-strong:#d6d9df; --hair:#e6e8ec; --hair-strong:#d6d9df;
  --ink:#121418; --muted:#687080; --faint:#a0a6b2;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 6px rgba(16,24,40,.03);
  --pop-shadow:0 12px 40px -8px rgba(16,24,40,.22),0 2px 6px rgba(16,24,40,.06);
  --ok:#157f3c; --ok-soft:#e6f6ec; --bad:#d4262c; --bad-soft:#fdeced; --warn:#a85a07; --warn-soft:#fff3e0;
  --a-ink:#121418; --a-ink-on:#ffffff;
  --accent:var(--a-ink); --accent-ink:var(--a-ink-on);
  --accent-soft:color-mix(in srgb,var(--accent) 10%,transparent);
  --focus:#4c6fff;
  --bar:#7d8dfc; --bar-2:#f2679f;
  --i-blue:#6f86ff; --i-green:#2fb466; --i-orange:#f2803a; --i-pink:#ef5d9a; --i-violet:#8e6cf6; --i-teal:#1aa6a0;
  --pip-ink:#17130f; --mW:#f3ebc6; --mU:#aed0ee; --mB:#c0b7b2; --mR:#f0ad93; --mG:#a3d2ad; --mC:#d8d3cd;
  --f-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;
  --f-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Charter,"Bitstream Charter",Georgia,serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px; --seg-on:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0c0f; --card:#15171c; --card-2:#1c1f25; --field-in:#101216;
    --line:#252931; --line-strong:#323741; --hair:#252931; --hair-strong:#323741;
    --ink:#eceef2; --muted:#9aa1ad; --faint:#6c7380;
    --shadow:0 1px 2px rgba(0,0,0,.3); --pop-shadow:0 16px 48px -10px rgba(0,0,0,.7);
    --ok:#3ccf74; --ok-soft:rgba(60,207,116,.14); --bad:#ff6b6b; --bad-soft:rgba(255,107,107,.14); --warn:#f5b84a; --warn-soft:rgba(245,184,74,.14);
    --a-ink:#eceef2; --a-ink-on:#121418;
    --bar:#8796ff; --bar-2:#ff7aaf; --seg-on:#30343d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0c0f; --card:#15171c; --card-2:#1c1f25; --field-in:#101216;
  --line:#252931; --line-strong:#323741; --hair:#252931; --hair-strong:#323741;
  --ink:#eceef2; --muted:#9aa1ad; --faint:#6c7380;
  --shadow:0 1px 2px rgba(0,0,0,.3); --pop-shadow:0 16px 48px -10px rgba(0,0,0,.7);
  --ok:#3ccf74; --ok-soft:rgba(60,207,116,.14); --bad:#ff6b6b; --bad-soft:rgba(255,107,107,.14); --warn:#f5b84a; --warn-soft:rgba(245,184,74,.14);
  --a-ink:#eceef2; --a-ink-on:#121418;
  --bar:#8796ff; --bar-2:#ff7aaf; --seg-on:#30343d;
  color-scheme:dark;
}
/* accent colours (Appearance) */
:root[data-accent="blue"]{--accent:#2f66f5;--accent-ink:#fff;--bar:#2f66f5}
:root[data-accent="violet"]{--accent:#6c55f0;--accent-ink:#fff;--bar:#7b66f3}
:root[data-accent="pink"]{--accent:#e0457f;--accent-ink:#fff;--bar:#ea5f95}
:root[data-accent="green"]{--accent:#16893f;--accent-ink:#fff;--bar:#25a557}
:root[data-accent="orange"]{--accent:#e0631a;--accent-ink:#fff;--bar:#ef7a35}
:root[data-accent="teal"]{--accent:#0f8f8a;--accent-ink:#fff;--bar:#18a39d}
:root[data-headings="sans"]{--f-display:var(--f-ui)}
*{box-sizing:border-box}
html{background:var(--bg);overflow-anchor:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:calc(14px*var(--fz));line-height:1.45;-webkit-font-smoothing:antialiased;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));min-height:100%}
a{color:var(--accent);text-decoration:none}
:root:not([data-accent]) a{color:var(--focus)}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:calc(17px*var(--fz))}
h2{font-size:calc(17px*var(--fz))}
h3{font-size:calc(14px*var(--fz));font-weight:600;margin-bottom:8px;color:var(--ink)}
.display{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:calc(12.5px*var(--fz))}
.card,details.sec,.panel,.ac ul,.actions{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
/* header */
.app{max-width:1480px;margin:0 auto}
.bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px 14px;padding:12px 4px;margin:0 0 4px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--f-display);font-size:calc(21px*var(--fz));font-weight:500;white-space:nowrap}
.brand h1 small{font-family:var(--f-ui);font-size:calc(12px*var(--fz));color:var(--muted);font-weight:500;margin-left:6px;letter-spacing:0}
.sources{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:calc(12px*var(--fz));background:var(--card);white-space:nowrap;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}.dot.bad{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}.dot.warn{background:var(--warn)}
.bar #genBtn{white-space:nowrap}
.cbcard{white-space:nowrap}.cbcard .addbtn{padding:1px 8px;margin-left:2px}
#cbCut{max-width:100%}
.iconbtn{width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--card)}
.iconbtn svg{width:18px;height:18px}
/* shell */
.wrap{display:grid;grid-template-columns:228px minmax(0,1fr);gap:16px;align-items:start}
.rail{position:sticky;top:70px;display:flex;flex-direction:column;gap:2px;padding:18px 12px 14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);max-height:calc(100vh - 86px);overflow:auto}
.rail .hello{font-family:var(--f-display);font-size:calc(22px*var(--fz));line-height:1.15;margin:0 6px 14px;font-weight:500;letter-spacing:-.01em}
.rail .grp-h{font-size:calc(11px*var(--fz));font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:14px 10px 6px;padding-top:12px;border-top:1px solid var(--line)}
.rail .grp-h:first-of-type{border-top:0;padding-top:0;margin-top:0}
.rail button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;box-shadow:none;border-radius:11px;padding:9px 10px;color:var(--muted);font-weight:500;font-size:calc(13.5px*var(--fz))}
.rail button svg{width:18px;height:18px;flex:none}
.rail button:hover{background:var(--card-2);color:var(--ink)}
.rail button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.rail .datacard{margin-top:16px;padding:10px 12px;border-radius:12px;background:var(--card-2);font-size:calc(12px*var(--fz));color:var(--muted);display:flex;flex-direction:column;gap:2px}
.rail .datacard b{color:var(--ink);font-weight:600}
.results{min-width:0;display:flex;flex-direction:column;gap:14px}
/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);padding:14px 14px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .kh{display:flex;align-items:center;gap:9px;margin-bottom:10px;min-width:0}
.kpi .ki{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.kpi .ki svg{width:16px;height:16px}
.kpi .kl{font-size:calc(12.5px*var(--fz));font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kv2{font-size:calc(25px*var(--fz));font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.kpi .kv2 small{font-size:calc(13px*var(--fz));font-weight:500;color:var(--muted);letter-spacing:0}
.kpi .ks{font-size:calc(11.5px*var(--fz));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.bad .kv2{color:var(--bad)}.kpi.warn .kv2{color:var(--warn)}
.kpi .kbar{height:4px;border-radius:999px;background:var(--card-2);overflow:hidden;margin:7px 0 3px}
.kpi .kbar i{display:block;height:100%;border-radius:999px;background:var(--i-green)}
.kpi.bad .kbar i{background:var(--bad)}
.mini{position:sticky;top:62px;z-index:30;display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--pop-shadow);font-size:calc(12.5px*var(--fz))}
.mini span{color:var(--muted)}.mini b{font-variant-numeric:tabular-nums;margin-left:4px}.mini .bad b{color:var(--bad)}.mini .warn b{color:var(--warn)}
@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* forms */
.settings{display:flex;flex-direction:column;gap:14px;min-width:0}
.page-h{display:flex;flex-direction:column;gap:4px;padding:4px 2px 0}
.page-h h2{font-family:var(--f-display);font-weight:500;font-size:calc(28px*var(--fz));letter-spacing:-.015em}
#pageHead{padding:6px 2px 0}#pageHead h2{font-size:calc(24px*var(--fz))}
.setup-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.setup-grid .col{display:flex;flex-direction:column;gap:14px;min-width:0}
.setup-more{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1180px){.setup-grid,.setup-more{grid-template-columns:minmax(0,1fr)}}
details.sec{border-radius:var(--r);overflow:visible;min-width:0}
details.sec>summary{cursor:pointer;padding:15px 18px;font-weight:600;font-size:calc(15px*var(--fz));list-style:none;display:flex;align-items:center;gap:10px;user-select:none;border-radius:var(--r)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .si{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:var(--card-2);color:var(--ink);flex:none}
details.sec>summary .si svg{width:16px;height:16px}
details.sec>summary .hint:empty{display:block;flex:1}
details.sec>summary::after{content:"";width:7px;height:7px;border-right:1.75px solid var(--faint);border-bottom:1.75px solid var(--faint);transform:rotate(45deg);margin-left:8px;flex:none}
details.sec[open]>summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
@media (prefers-reduced-motion:no-preference){details.sec>summary::after{transition:transform .2s ease}}
details.sec>summary .hint{font-weight:500;color:var(--muted);font-size:calc(12px*var(--fz));margin-left:auto;text-align:right}
.body{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:calc(12.5px*var(--fz));color:var(--muted);font-weight:500;min-width:0}
label.c{display:flex;align-items:center;gap:8px;font-size:calc(13px*var(--fz))}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-width:0;background:var(--field-in);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:9px 11px;font-size:calc(13.5px*var(--fz));color:var(--ink)}
@media (prefers-reduced-motion:no-preference){input,select,textarea,button{transition:border-color .15s,box-shadow .15s,background-color .15s,transform .1s}}
select{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
textarea{font-family:var(--f-mono);font-size:calc(12.5px*var(--fz));min-height:72px;resize:vertical}
input[type=file]{font-size:calc(12.5px*var(--fz));color:var(--muted);max-width:100%}
input[type=file]::file-selector-button{font:inherit;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;margin-right:8px;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
input[type=range]{accent-color:var(--accent);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:8px 15px;font-size:calc(13px*var(--fz));font-weight:500;color:var(--ink)}
button:hover{background:var(--card-2)}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
button.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--bg))}
button.small{padding:4px 11px;font-size:calc(12px*var(--fz))}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.note{font-size:calc(12.5px*var(--fz));color:var(--muted)}
.note code,.mono-inline,code{font-family:var(--f-mono);font-size:calc(11.5px*var(--fz))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ac{position:relative}
.ac ul{position:absolute;z-index:50;left:0;right:0;top:100%;margin:6px 0 0;padding:4px;list-style:none;border-radius:12px;max-height:280px;overflow:auto;box-shadow:var(--pop-shadow)}
.ac li{padding:8px 10px;cursor:pointer;font-size:calc(13px*var(--fz));display:flex;justify-content:space-between;gap:8px;border-radius:8px}
.ac li[aria-selected="true"],.ac li:hover{background:var(--card-2)}
/* tables */
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:calc(13.5px*var(--fz))}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:10px 10px;text-align:left;vertical-align:top}
table.t th{font-weight:500;color:var(--muted);font-size:calc(11px*var(--fz));text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;padding-top:6px}
table.t td.n,table.t th.n{text-align:right}
table.t td.cost{white-space:nowrap}
table.t tbody tr:not(.grp):hover td{background:var(--card-2)}
table.t tr.grp td{background:transparent;color:var(--ink);font-weight:600;font-size:calc(12px*var(--fz));letter-spacing:.02em;padding-top:20px;border-bottom:1px solid var(--line-strong)}
table.t.compact td,table.t.compact th{padding:6px 8px;font-size:calc(13px*var(--fz))}
table.t.compact th{font-size:calc(10.5px*var(--fz))}
.scroll{overflow-x:auto;min-width:0}
/* status strip and pages */
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-radius:999px;padding:6px 6px 6px 16px}
#status{font-size:calc(12.5px*var(--fz));color:var(--muted);margin-right:auto;min-width:0;flex:1 1 260px}
.panel{border-radius:var(--r);padding:18px 20px;min-width:0}
.page-title{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.page-title h2{font-size:calc(18px*var(--fz))}
.page-title svg{width:20px;height:20px}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:calc(11.5px*var(--fz));background:var(--card-2);border:1px solid var(--line);margin:1px 3px 1px 0;white-space:nowrap}
.chip.gc{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.flag{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.st{display:inline-block;min-width:48px;text-align:center;font-size:calc(11.5px*var(--fz));font-weight:600;padding:3px 9px;border-radius:999px}
.st.pass{background:var(--ok-soft);color:var(--ok)}.st.fail{background:var(--bad-soft);color:var(--bad)}.st.na{background:var(--card-2);color:var(--muted)}
.msg{border-radius:12px;padding:11px 15px;font-size:calc(13px*var(--fz));border:1px solid var(--line)}
.msg+.msg{margin-top:8px}
.msg.err{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.msg.warn{background:var(--warn-soft);color:var(--ink);border-color:transparent}
.msg.warn b{color:var(--warn)}
.msg ul{margin:4px 0 0;padding-left:18px}
.ms{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 3px;border-radius:9px;font-family:var(--f-mono);font-size:calc(10px*var(--fz));font-weight:600;color:var(--pip-ink);background:var(--mC);margin-right:2px;vertical-align:1px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 1px 1px rgba(0,0,0,.15)}
.ms.W{background:var(--mW)}.ms.U{background:var(--mU)}.ms.B{background:var(--mB)}.ms.R{background:var(--mR)}.ms.G{background:var(--mG)}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 4px;padding-bottom:2px;scrollbar-width:thin}
.subtabs button{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:transparent;padding:6px 14px;color:var(--muted);font-weight:500;font-size:calc(13px*var(--fz))}
.subtabs button[aria-selected="true"]{color:var(--accent-ink);background:var(--accent);border-color:transparent;font-weight:600}
table.turns td,table.turns th{white-space:nowrap}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px 18px}
.kv{display:flex;flex-direction:column;gap:3px;min-width:0}
.kv>span{font-size:calc(11px*var(--fz));color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.kv b{font-weight:600;font-size:calc(16px*var(--fz));letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.why{color:var(--muted);font-size:calc(12.5px*var(--fz));min-width:180px;max-width:340px}
td.nm{min-width:160px}
td.nm a{color:var(--ink);font-weight:500}
tr.locked td.nm a{color:var(--accent)}
:root:not([data-accent]) tr.locked td.nm a{color:var(--focus)}
tr.alt td{background:var(--card-2)}

.rhead{margin:4px 0 8px}
ol.recs-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rec{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.thb{padding:0;border:0;background:none;border-radius:6px;display:block;width:64px}
.thb:hover{background:none}
.th{display:block;width:64px;aspect-ratio:146/204;border-radius:4px;background:var(--card-2);object-fit:cover}
.th-txt{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;border:1px solid var(--line)}
.rb{min-width:0;display:flex;flex-direction:column;gap:3px}
.rt{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
button.cname{border:0;background:none;padding:0;font-weight:600;font-size:calc(14px*var(--fz));text-align:left;color:var(--ink);border-radius:4px}
button.cname:hover{background:none;text-decoration:underline}
.sh{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.sh .chip{margin:0}
.chip.inf{background:var(--accent-soft)}
.sbar{display:flex;height:8px;border-radius:999px;background:var(--card-2);overflow:hidden;margin-top:4px}
.sbar i{display:block;height:100%}
.bd{font-size:calc(11.5px*var(--fz))}
.rs{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rs .pct{font-size:calc(22px*var(--fz));letter-spacing:-.02em;line-height:1.1}
.plus{color:var(--muted);font-weight:600;margin-right:-4px}
.combo .rt{justify-content:flex-start}
.method{margin-top:16px}.method summary{cursor:pointer}.method ul{padding-left:18px;display:flex;flex-direction:column;gap:4px}
/* empty state */
.cx .empty{max-width:none}
.starter{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:8px}
.st-card{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;text-align:left;font-size:calc(12.5px*var(--fz))}
.st-card img{width:100%;aspect-ratio:146/204;border-radius:5px;object-fit:cover}
@media (max-width:640px){.rec{grid-template-columns:48px minmax(0,1fr) auto;gap:10px}.thb,.th{width:48px}.ctl{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.wgrid{grid-template-columns:minmax(0,1fr)}.bd{display:none}.kvs{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

<script>
/* ===== Engine: pure deck-generation logic (no DOM, no network) ===== */
const Engine = (function () {
  'use strict';
  const WUBRG = 'WUBRG';
  const BASIC_NAMES = { W: 'Plains', U: 'Island', B: 'Swamp', R: 'Mountain', G: 'Forest', C: 'Wastes' };
  const ROLES = ['ramp', 'draw', 'removal', 'wipes', 'protection', 'recursion', 'wincon'];
  const SLOT_LABEL = { commander: 'Commander', include: 'Include', locked: 'Locked', land: 'Land', basic: 'Basic land',
    ramp: 'Ramp', draw: 'Card draw', removal: 'Targeted removal', wipes: 'Board wipe', protection: 'Protection',
    recursion: 'Recursion', wincon: 'Win condition', synergy: 'Synergy', flex: 'Flex', combo: 'Combo piece' };
  const SKIP_LAYOUTS = new Set(['token', 'double_faced_token', 'emblem', 'art_series', 'vanguard', 'scheme', 'planar']);
  const BRACKETS = {
    // Commander Brackets as of the Oct 21 2025 update (unchanged by Feb 9 2026): tutor limits removed from all brackets.
    // turns = expected game length the bracket is built for. xturn 1/2 for B2/B3 encode "low quantity, not chained or looped".
    1: { name: 'Exhibition', turns: '9+', gc: 0, mld: 0, xturn: 0, tutor: 999, combo2: 0 },
    2: { name: 'Core', turns: '8+', gc: 0, mld: 0, xturn: 1, tutor: 999, combo2: 0 },
    3: { name: 'Upgraded', turns: '6+', gc: 3, mld: 0, xturn: 2, tutor: 999, combo2: 0 },
    4: { name: 'Optimized', turns: '4+', gc: 999, mld: 999, xturn: 999, tutor: 999, combo2: 999 },
    5: { name: 'cEDH', turns: 'any', gc: 999, mld: 999, xturn: 999, tutor: 999, combo2: 999 }
  };

  /* ---------- utils ---------- */
  function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function stable(o) { if (o === null || typeof o !== 'object') return JSON.stringify(o); if (Array.isArray(o)) return '[' + o.map(stable).join(',') + ']'; return '{' + Object.keys(o).sort().map(k => JSON.stringify(k) + ':' + stable(o[k])).join(',') + '}'; }
  function pnum(v) { const n = v == null ? NaN : parseFloat(v); return isFinite(n) ? n : null; }
  function nameKey(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[‘’]/g, "'").replace(/\s+/g, ' ').trim(); }
  function stripReminder(s) { return s.replace(/\([^)]*\)/g, ''); }
  function subsetCI(ci, CI) { for (const x of ci) if (!CI.includes(x)) return false; return true; }
  function deepMerge(base, over) {
    if (over == null || typeof over !== 'object' || Array.isArray(over)) return over === undefined ? base : over;
    const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    for (const k of Object.keys(over)) {
      const b = base ? base[k] : undefined, v = over[k];
      out[k] = (b && typeof b === 'object' && !Array.isArray(b) && v && typeof v === 'object' && !Array.isArray(v)) ? deepMerge(b, v) : v;
    }
    return out;
  }
  const r2 = x => Math.round(x * 100) / 100;

  /* ---------- defaults ---------- */
  function defaults() {
    return {
      v: 1, commanders: ['', ''], bracket: 3, bl: Object.assign({}, BRACKETS[3]),
      archetype: '', tags: '',
      budget: { total: null, perCard: null, cur: 'usd', inclBasics: true, unknown: 'exclude' },
      targets: { lands: 37, ramp: 10, draw: 10, removal: 9, wipes: 3, protection: 3, recursion: 2, wincon: 3 },
      mana: { avgMV: 3.0, nonbasic: null, types: { fetch: true, shock: true, dual: true, triome: true, utility: true, command: true } },
      include: '', exclude: '',
      filters: { combos: 'bracket', tutors: 'allow', fast: 'allow', stax: 'allow', xturn: 'allow', mld: 'allow', hate: 'allow',
        reserved: 'allow', funny: 'exclude', dateFrom: '', dateTo: '', sets: '', creaturesMin: null, creaturesMax: null },
      owned: { mode: 'off', list: '' },
      seed: '', reroll: 0, variance: 0,
      weights: { syn: 1.5, role: 1.5, pop: 5, quality: 2, curve: 1.5, price: 0.25, owned: 1, bracket: 0.5, power: 2, link: 1 }
    };
  }
  function bracketDefaults(b) { return Object.assign({}, BRACKETS[b] || BRACKETS[3]); }

  /* ---------- normalization of Scryfall card objects ---------- */
  // P/T, loyalty or defense for display; image path on cards.scryfall.io (shown only when the user turns images on)
  const ptOf = f => f.power != null ? f.power + '/' + f.toughness : f.loyalty != null ? 'Loyalty ' + f.loyalty : f.defense != null ? 'Defense ' + f.defense : '';
  function imgOf(u) { const m = u && typeof u.normal === 'string' && /^https:\/\/cards\.scryfall\.io\/normal\/(front\/[0-9a-f]\/[0-9a-f]\/[0-9a-f-]+\.jpg)/.exec(u.normal); return m ? m[1] : ''; }
  function norm(c) {
    if (!c || typeof c !== 'object' || !c.name || c.object === 'list') return null;
    if (SKIP_LAYOUTS.has(c.layout)) return null;
    if (c.lang && c.lang !== 'en') return null;
    const faces = Array.isArray(c.card_faces) ? c.card_faces : null;
    const name = c.name, fn = name.split(' // ')[0];
    const ot = c.oracle_text != null ? c.oracle_text : (faces ? faces.map(f => f.oracle_text || '').join('\n') : '');
    const mc = c.mana_cost ? c.mana_cost : (faces ? faces.map(f => f.mana_cost || '').filter(Boolean).join(' // ') : '');
    const tl = c.type_line || (faces ? faces.map(f => f.type_line || '').join(' // ') : '');
    const ft = tl.split(' // ')[0];
    let low = stripReminder(ot).toLowerCase();
    const nm = new Set([name, fn].concat(faces ? faces.map(f => f.name) : []).filter(Boolean).map(x => x.toLowerCase()));
    for (const n of [...nm].sort((a, b) => b.length - a.length)) low = low.split(n).join('~');
    const pr = c.prices || {};
    const pw = c.power != null ? c.power : (faces && faces[0] ? faces[0].power : null);
    return {
      n: name, fn, oid: c.oracle_id || (faces && faces[0] && faces[0].oracle_id) || c.id, mc, cmc: +c.cmc || 0, tl, ft, ot, low,
      ci: WUBRG.split('').filter(x => (c.color_identity || []).includes(x)).join(''),
      leg: (c.legalities && c.legalities.commander) || 'not_legal', gc: !!c.game_changer,
      rank: Number.isFinite(c.edhrec_rank) ? c.edhrec_rank : null,
      p: { usd: pnum(pr.usd), eur: pnum(pr.eur), tix: pnum(pr.tix) },
      rl: !!c.reserved, bc: c.border_color || '', stamp: c.security_stamp || '', stype: c.set_type || '',
      sets: c.set ? [c.set] : [], first: c.released_at || '', last: c.released_at || '',
      kw: (c.keywords || []).map(k => String(k).toLowerCase()), pm: Array.isArray(c.produced_mana) ? c.produced_mana : [],
      pow: pnum(pw), uri: c.scryfall_uri || '', otags: [],
      pt: ptOf(c.power != null || c.loyalty != null || c.defense != null ? c : (faces && faces[0]) || {}), img: imgOf(c.image_uris || (faces && faces[0] && faces[0].image_uris))
    };
  }
  function mergeCard(a, b) {
    for (const s of b.sets) if (!a.sets.includes(s)) a.sets.push(s);
    if (b.first && (!a.first || b.first < a.first)) a.first = b.first;
    if (b.last && (!a.last || b.last > a.last)) a.last = b.last;
    for (const k of ['usd', 'eur', 'tix']) if (b.p[k] != null && (a.p[k] == null || b.p[k] < a.p[k])) a.p[k] = b.p[k];
    if (b.rank != null && (a.rank == null || b.rank < a.rank)) a.rank = b.rank;
    a.gc = a.gc || b.gc; a.rl = a.rl || b.rl;
    for (const t of b.otags) if (!a.otags.includes(t)) a.otags.push(t);
    a.merged = (a.merged || 1) + 1;
  }
  function buildDB(cards, meta) {
    const byOid = new Map();
    for (const c of cards) { if (!c) continue; const e = byOid.get(c.oid); if (e) mergeCard(e, c); else byOid.set(c.oid, c); }
    const all = [...byOid.values()].sort((a, b) => a.n < b.n ? -1 : a.n > b.n ? 1 : 0);
    const byName = new Map();
    for (const c of all) for (const k of [c.n, c.fn]) { const key = nameKey(k); if (!byName.has(key)) byName.set(key, c); }
    return { all, byName, meta: meta || {}, _ctypes: null };
  }
  function lookup(db, name) { return db.byName.get(nameKey(name)) || null; }

  /* ---------- list parsing (decklists, collections) ---------- */
  function parseList(text) {
    const out = [];
    const lines = String(text || '').split(/\r?\n/);
    let csvName = -1, csvQty = -1;
    if (lines.length && /,/.test(lines[0]) && /\bname\b/i.test(lines[0])) {
      const h = splitCSV(lines[0]).map(x => x.toLowerCase().trim());
      csvName = h.indexOf('name'); csvQty = h.findIndex(x => x === 'count' || x === 'quantity' || x === 'qty');
      if (csvName >= 0) lines.shift();
    }
    for (let line of lines) {
      if (csvName >= 0) { const f = splitCSV(line); if (f[csvName]) out.push({ qty: csvQty >= 0 ? (parseInt(f[csvQty], 10) || 1) : 1, name: f[csvName].trim() }); continue; }
      line = line.trim();
      if (!line || /^(#|\/\/)/.test(line)) continue;
      if (/^(commander|deck|sideboard|maybeboard|companion|mainboard)\s*:?$/i.test(line)) continue;
      let qty = 1, name = line;
      const m = line.match(/^(\d+)\s*x?\s+(.+)$/i);
      if (m) { qty = parseInt(m[1], 10); name = m[2]; }
      name = name.replace(/\s+\*[A-Z]+\*/g, '').replace(/\s+\[[^\]]*\]\s*$/, '').replace(/\s+\([A-Za-z0-9]{2,6}\)(\s+[\w★-]+)?\s*$/, '').trim();
      if (name) out.push({ qty: Math.max(1, qty), name });
    }
    return out;
  }
  function splitCSV(line) { const out = []; let cur = '', q = false; for (let i = 0; i < line.length; i++) { const ch = line[i]; if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; } else if (ch === '"') q = true; else if (ch === ',') { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; }

  /* ---------- tagging rules (all data-derived from oracle text / type line / Scryfall fields) ---------- */
  const rx = (id, desc, re) => ({ id, desc, test: typeof re === 'function' ? re : (c => re.test(c.low)) });
  const ROLE_RULES = {
    ramp: [
      rx('ramp-mana', 'non-land with a mana ability: "add {X}" / "add N mana"', /\badd \{[wubrgcs]\}|\badd (?:one|two|three|x) mana|\badd [^.]{0,30}mana of any/),
      rx('ramp-land', 'searches library for land card(s) onto the battlefield', /search your library for [^.]{0,80}\bland cards?[\s\S]{0,160}?onto the battlefield/),
      rx('ramp-drop', 'extra land drop / put land from hand onto battlefield', /play (?:an|two|x) additional lands?|put (?:a|up to \w+) land cards? from your hand onto the battlefield/),
      rx('ramp-treasure', 'creates Treasure tokens', /\bcreates?[^.]{0,30}treasure/)
    ],
    draw: [
      rx('draw-n', '"draw N card(s)"', /\bdraws? (?:a|an|one|two|three|four|five|six|seven|x|\d+|that many|cards equal)(?: additional)? cards?\b|\bdraws? cards equal/),
      rx('draw-impulse', 'exile top card(s), you may play/cast them', /exile the top [^.]*?cards? of your library[^.]*\.[^.]*you may (?:play|cast)/),
      rx('draw-clue', 'investigate / creates Clues', /\binvestigates?\b|creates?[^.]{0,20}\bclue/)
    ],
    removal: [
      rx('rm-destroy', '"destroy/exile target <permanent>" (not "you control", not cards in graveyards)', /\b(?:destroy|exile) (?:up to (?:one|two|three|x) )?(?:another )?target (?:(?:nonland|noncreature|nonartifact|tapped|attacking|blocking|nontoken|legendary|artifact or|creature or|enchantment or|artifact,) )*(?:creature|artifact|enchantment|planeswalker|permanent|land|battle)s?(?!s? (?:you control|card))/),
      rx('rm-burn', 'deals damage to target creature/planeswalker or any target', /\bdeals? [^.]{0,40}?damage to (?:any target|target creature|target planeswalker|up to one target creature|another target creature)/),
      rx('rm-bounce', 'returns target nonland permanent to owner\'s hand', /\breturn (?:up to one )?target (?:nonland |creature |artifact |enchantment )*(?:permanent|creature|artifact|enchantment|planeswalker)(?! you control)[^.]* to (?:its|their) owner'?s'? hands?/),
      rx('rm-counter', 'counter target spell/ability', /\bcounter target (?:spell|creature spell|noncreature spell|artifact|instant|activated|activated or triggered|instant or sorcery)/),
      rx('rm-shrink', 'target creature gets -N/-N', /\btarget creature(?: an opponent controls)? gets -(?:\d+|x)\/-(?:\d+|x)/),
      rx('rm-edict', 'target player/each opponent sacrifices a creature/permanent', /\b(?:target player|target opponent|each opponent) sacrifices (?:a|an|one|two|x|that many)? ?(?:creature|attacking creature|nonland permanent|permanent|artifact|enchantment|planeswalker)/),
      rx('rm-fight', 'fight / bite a target creature', /\bfights? (?:another |up to one )?target creature|target creature you control (?:fights|deals damage equal)/)
    ],
    wipes: [
      rx('wipe-all', '"destroy/exile all creatures/nonland permanents/…"', /\b(?:destroy|exile) all (?:other )?(?:creatures|nonland permanents|permanents|artifacts|enchantments|planeswalkers|nontoken creatures|creatures and planeswalkers|artifacts and enchantments|nonland, nontoken permanents|creatures your opponents control|nonland permanents your opponents control|attacking creatures)/),
      rx('wipe-shrink', 'all/each creature(s) get -N/-N', /\ball (?:other )?creatures get -(?:\d+|x)\/-(?:\d+|x)|\beach creature gets -/),
      rx('wipe-dmg', 'deals N damage to each creature', /\bdeals? (?:\d+|x) damage to each (?:other )?creature/),
      rx('wipe-bounce', 'returns all permanents/creatures to hand', /\breturn all (?:other )?(?:nonland )?(?:permanents|creatures)[^.]* to (?:their|its) owners'? hands?/),
      rx('wipe-sac', 'each player sacrifices all creatures', /\beach (?:player|opponent) sacrifices all (?:creatures|nonland permanents)/)
    ],
    protection: [
      rx('prot-team', 'permanents/creatures you control gain hexproof/indestructible/shroud/protection', /(?:creatures|permanents|commanders?|nonland permanents|artifacts) you control (?:gain|have|get [^.]{0,30}and gain) (?:hexproof|indestructible|shroud|protection)/),
      rx('prot-target', 'target permanent you control gains protection / phases out', /target (?:creature|permanent|artifact|nonland permanent)(?: or [a-z]+)? you control (?:gains|has|phases out)/),
      rx('prot-self', 'you have hexproof/shroud; phase out', /\byou have (?:hexproof|shroud)|\bphases? out\b/),

  /* ---------- combos (Commander Spellbook) ---------- */
  // Decodes the site's compact Spellbook files (tools/spellbook-shard.js) into variant objects:

  /* ---------- generation ---------- */

      const cands = sortScored(pool.filter(c => !analyze(c).isLand && !st.names.has(c.n) && filter(c)).map(c => ({ c, s: dyn(c) })));
      let n = 0;
      for (const x of cands) {
        if (nonlandSlots() <= 0) break;
        if (cmin != null && cmin - st.creatures >= nonlandSlots() && !analyze(x.c).creature) continue;
        if (canAdd(x.c)) continue;
        add(x.c, phase, 1, x.s); n++;

      return n;
    };
    /* several themes: round-robin by weight so one large theme cannot crowd out the others */
    const synFill = () => {
      if (tags.length < 2) return fill('synergy', c => synOf(c).s > 0);
      const lists = tags.map(t => ({ t, got: 0, cands: sortScored(pool.filter(c => !analyze(c).isLand && t.test(c)).map(c => ({ c, s: dyn(c) }))), i: 0 }));
      for (const l of lists) l.got = deck.filter(e => !analyze(e.c).isLand && l.t.test(e.c)).length;
      let n = 0;
      for (let guard = 0; guard < 400 && nonlandSlots() > 0; guard++) {
        const open = lists.filter(l => l.i < l.cands.length);
        if (!open.length) break;
        const l = open.sort((a, b) => a.got / a.t.w - b.got / b.t.w || (a.t.key < b.t.key ? -1 : 1))[0];
        const x = l.cands[l.i++];
        if (st.names.has(x.c.n)) continue;
        if (cmin != null && cmin - st.creatures >= nonlandSlots() && !analyze(x.c).creature) continue;
        if (canAdd(x.c)) continue;
        add(x.c, 'synergy', 1, dyn(x.c)); n++;
        for (const m of lists) if (m.t.test(x.c)) m.got++;

    };
    const nSyn = tags.length ? synFill() : 0;
    L('Synergy: ' + nSyn + ' cards matching tags [' + tags.map(t => t.label).join(', ') + ']' + (R.themeCounts ? '; per theme (incl. role cards): ' + R.themeCounts.map(x => x.label + ' ' + x.n).join(', ') : '') + '.');
    const nFlex = fill('flex', () => true);
    L('Flex: ' + nFlex + ' cards by score.');

    /* 5. combos: prefer */
    if (comboPolicy === 'prefer' && combos && combos.almost) {
      try {
        const poolNames = pool.filter(c => !st.names.has(c.n)).map(c => c.n);
        const al = (await combos.almost(deckNames(), poolNames)).filter(x => !(x.v.inf && x.v.c.length <= 2 && lim.combo2 <= 0));
        al.sort((a, b) => a.missing.length - b.missing.length || (a.v.id < b.v.id ? -1 : 1));
        let added = 0;
        for (const x of al) {
          if (added >= 2) break;
          const cards = x.missing.map(n => lookup(db, n)).filter(Boolean);
          if (cards.length !== x.missing.length || cards.some(c => !pool.includes(c) || st.names.has(c.n))) continue;
          const victims = deck.filter(e => !e.locked && (e.slot === 'flex' || e.slot === 'synergy')).sort((a, b) => a.score - b.score).slice(0, cards.length);
          if (victims.length < cards.length) break;
          victims.forEach(removeEntry);
          if (cards.some(c => canAdd(c))) { victims.forEach(v => add(v.c, v.slot, v.qty, v.score)); continue; }
          cards.forEach(c => add(c, 'combo', 1, base(c), 'completes combo: ' + x.v.c.join(' + ') + ' → ' + x.v.p.slice(0, 2).join(', ')));
          L('Combo (prefer): added ' + cards.map(c => c.n).join(', ') + ' replacing ' + victims.map(v => v.c.n).join(', ') + ' for ' + x.v.c.join(' + ') + '.');
          added++;

        if (!added) L('Combo (prefer): no completable combo found in pool.');
      } catch (err) { R.warnings.push('Combo lookup failed: ' + (err && err.message || err)); }
    }

    /* 6. curve adjustment (soft) */
    const avgMV = () => { const nl = deck.filter(e => !analyze(e.c).isLand); const q = nl.reduce((s, e) => s + e.qty, 0); return q ? nl.reduce((s, e) => s + e.c.cmc * e.qty, 0) / q : 0; };
    const curveOk = (c, slot) => slot === 'synergy' ? synOf(c).s > 0 : ROLES.includes(slot) ? !!analyze(c).roles[slot] : true;
    const curveStep = up => {
      const victims = deck.filter(e => !e.locked && e.qty === 1 && (e.slot === 'flex' || e.slot === 'synergy' || ROLES.includes(e.slot)) && (up ? e.c.cmc < T - 0.5 : e.c.cmc > T))
        .sort((a, b) => (up ? a.c.cmc - b.c.cmc : b.c.cmc - a.c.cmc) || a.score - b.score);
      for (const victim of victims) {
        const rep = sortScored(pool.filter(c => !analyze(c).isLand && !st.names.has(c.n) && (up ? c.cmc > victim.c.cmc && c.cmc <= T + 2 : c.cmc <= T) && curveOk(c, victim.slot)).map(c => ({ c, s: dyn(c) })))
          .find(x => x.s >= victim.score - 1.5 && !canAdd(x.c, { replacing: victim }));
        if (!rep) continue;
        removeEntry(victim); add(rep.c, victim.slot, 1, rep.s);
        L('Curve' + (up ? ' (up)' : '') + ': swapped ' + victim.c.n + ' (' + victim.slot + ', MV ' + victim.c.cmc + ', score ' + victim.score.toFixed(2) + ') → ' + rep.c.n + ' (MV ' + rep.c.cmc + ', score ' + rep.s.toFixed(2) + '); avg MV now ' + avgMV().toFixed(2) + '.');
        return true;
      }
      return false;
    };
    for (let i = 0; i < 20 && avgMV() > T + 0.15 && curveStep(false); i++);
    for (let i = 0; i < 20 && avgMV() < T - 0.15 && curveStep(true); i++);

    /* 7. basics */
    function addBasics(n, label) {
      if (n <= 0) return;
      const pp = { W: 0, U: 0, B: 0, R: 0, G: 0 };
      for (const c of cmds) { const p = pips(c.mc); for (const k in pp) pp[k] += p[k]; }
      for (const e of deck) if (!analyze(e.c).isLand) { const p = pips(e.c.mc); for (const k in pp) pp[k] += p[k] * e.qty; }
      const cols = CI ? CI.split('') : ['C'];
      const wsum = cols.reduce((s, x) => s + (pp[x] || 0), 0);
      const share = cols.map(x => ({ x, w: wsum > 0 ? (pp[x] || 0) / wsum : 1 / cols.length }));
      const alloc = share.map(s => ({ x: s.x, n: Math.floor(s.w * n), r: s.w * n - Math.floor(s.w * n) }));
      let left = n - alloc.reduce((s, a) => s + a.n, 0);
      alloc.slice().sort((a, b) => b.r - a.r || (a.x < b.x ? -1 : 1)).forEach(a => { if (left > 0) { a.n++; left--; } });
      for (const a of alloc) {
        if (!a.n) continue;
        const b = basicsCards[a.x];
        const ex = deck.find(e => e.c === b);
        if (ex) { ex.qty += a.n; st.total += (S.budget.inclBasics ? (price(b) || 0) : 0) * a.n; ex.why = reason(b, 'basic', 'pip-weighted: ' + ex.qty + ' of ' + (landTarget) + ' lands'); }
        else add(b, 'basic', a.n, 0, label || ('pip-weighted share ' + (share.find(s => s.x === a.x).w * 100).toFixed(0) + '%'));
      }
      R.pipShare = share;
    }
    const nlLeft = nonlandSlots();
    if (nlLeft > 0) {
      const flexRej = {}; for (const c of pool) if (!st.names.has(c.n) && !analyze(c).isLand) { const r = canAdd(c, { noPace: true }); if (r) flexRej[r] = (flexRej[r] || 0) + 1; }
      R.warnings.push(nlLeft + ' nonland slot(s) could not be filled within the constraints and were filled with basic lands. Remaining nonland candidates: ' + pool.filter(c => !st.names.has(c.n) && !analyze(c).isLand).length + (Object.keys(flexRej).length ? ' (blocked by: ' + Object.entries(flexRej).map(([k, v]) => k + ' ' + v).join(', ') + ')' : '') + '.');
    }
    addBasics(mainSize - size());
    L('Basics: ' + deck.filter(e => isBasic(e.c)).map(e => e.qty + ' ' + e.c.n).join(', ') + '.');

    /* 7b. optimise: steps 1–7 are a greedy baseline. This step searches the whole candidate pool for swaps that raise the
       deck's total score J, re-scanning every (deck card, pool card) pair after each round until no swap improves J.
       J = Σ base(nonland card) + pair synergy (enabler × payoff per theme) − role-shortfall − curve-drift penalties.
       A swap blocked by the total budget may be paired with a cheaper swap elsewhere (incl. nonbasic land → basic)
       when the two together raise J. All moves pass canAdd (budget, bracket, creature cap, combos). */
    {
      const t0 = Date.now(), timeCap = +(S.optTimeMs || 60000); // safety only: rounds, not time, end the search, so results never depend on machine speed
      const Wl = W.link != null ? +W.link : 1;
      const NP = PAIRS.length, tagKeys = new Set(tags.map(t => t.key));
      const PW = PAIRS.map(p => (cmds.some(c => p.en(c) || p.pay(c)) || tagKeys.has(p.key)) ? 1 : 0.35);
      const sidesCache = new Map();
      const sides = c => { let v = sidesCache.get(c); if (v) return v; v = []; PAIRS.forEach((p, i) => { if (p.en(c)) v.push(2 * i); if (p.pay(c)) v.push(2 * i + 1); }); sidesCache.set(c, v); return v; };
      const roleBits = c => { const a = analyze(c); let b = 0; ROLES.forEach((r, i) => { if (a.roles[r]) b |= 1 << i; }); return b; };
      const pc = b => { let n = 0; while (b) { n += b & 1; b >>>= 1; } return n; };
      const G = (i, en, pay) => PW[i] * 2 * Math.sqrt(en * pay);
      const cnt = new Float64Array(NP * 2);
      for (const c of cmds) for (const k of sides(c)) cnt[k] += 3; // commander counts 3, as in the analysis
      for (const e of deck) if (!isBasic(e.c)) for (const k of sides(e.c)) cnt[k] += e.qty;
      const synTotal = () => { let g = 0; for (let i = 0; i < NP; i++) g += G(i, cnt[2 * i], cnt[2 * i + 1]); return Wl * g; };
      const tgt = ROLES.map(r => +S.targets[r] || 0), rc = ROLES.map(r => roleCount(r));
      const nlE = () => deck.filter(e => !analyze(e.c).isLand);
      const nN = nlE().reduce((s, e) => s + e.qty, 0); let mvSum = nlE().reduce((s, e) => s + e.c.cmc * e.qty, 0);
      const curvePen = sum => W.curve * 8 * Math.max(0, Math.abs((nN ? sum / nN : T) - T) - 0.15);
      const shortfall = () => ROLES.reduce((s, r, i) => s + Math.max(0, tgt[i] - rc[i]), 0);
      const landVal = c => isBasic(c) ? 0 : landScore(c);
      const J = () => deck.reduce((s, e) => s + (analyze(e.c).isLand ? landVal(e.c) * e.qty : base(e.c) * e.qty), 0) + synTotal() - W.role * 2 * shortfall() - curvePen(mvSum);
      const pr = c => isBasic(c) && !S.budget.inclBasics ? 0 : (price(c) || 0);
      const split = sd => { const both = [], one = []; for (const k of sd) { if (k % 2 === 0 && sd.includes(k + 1)) both.push(k / 2); else if (!(k % 2 === 1 && sd.includes(k - 1))) one.push(k); } return { both, one }; };
      const cands = pool.filter(c => !analyze(c).isLand).map(c => ({ c, b: base(c), sd: sides(c), ...split(sides(c)), rb: roleBits(c), cr: analyze(c).creature, mv: c.cmc, p: pr(c), inDeck: st.names.has(c.n) }));
      const byName = new Map(cands.map(x => [x.c.n, x]));
      const bestBasic = () => { const sh = (R.pipShare || []).slice().sort((a, b) => b.w - a.w); for (const x of sh) if (basicsCards[x.x]) return basicsCards[x.x]; return basicsCards[Object.keys(basicsCards)[0]]; };
      const J0 = J(); let pairs = 0, rounds = 0; const swaps = [], tabu = new Set();
      const validBudget = () => cap == null || st.total <= cap + 1e-9;
      const doSwap = (out, x, d, tag) => {
        for (const k of sides(out.c)) cnt[k] -= 1; const ob = roleBits(out.c); ROLES.forEach((r, i) => { if (ob & (1 << i)) rc[i]--; });
        if (!analyze(out.c).isLand) mvSum -= out.c.cmc;
        const xr = x.land ? null : ROLES.find((r, i) => (x.rb & (1 << i)) && rc[i] < tgt[i]) || ROLES.find((r, i) => (x.rb & (1 << i)) && (roleBits(out.c) & (1 << i)));
        const slot = xr || (!x.land && synOf(x.c).s > 0 ? 'synergy' : 'flex');
        removeEntry(out); const ox = byName.get(out.c.n); if (ox) ox.inDeck = false;
        if (x.land) { const ex = deck.find(e => e.c === x.c); if (ex) { ex.qty++; st.total += pr(x.c); } else add(x.c, 'basic', 1, 0, 'optimiser: budget for a better spell'); }
        else { add(x.c, slot, 1, x.b, 'optimiser swap (' + tag + ')'); x.inDeck = true; for (const k of x.sd) cnt[k] += 1; ROLES.forEach((r, i) => { if (x.rb & (1 << i)) rc[i]++; }); mvSum += x.mv; }
        swaps.push({ out: out.c.n, in: x.c.n, d, tag });
      };
      // exact change in J for one swap in the current state (used to verify paired moves)
      const exactD = (out, x) => { const snap = { cnt: Float64Array.from(cnt), rc: rc.slice(), mv: mvSum };
        for (const k of sides(out.c)) cnt[k] -= 1; const ob = roleBits(out.c); ROLES.forEach((r, i) => { if (ob & (1 << i)) rc[i]--; }); if (!analyze(out.c).isLand) mvSum -= out.c.cmc;
        if (!x.land) { for (const k of x.sd) cnt[k] += 1; ROLES.forEach((r, i) => { if (x.rb & (1 << i)) rc[i]++; }); mvSum += x.mv; }
        const outV = analyze(out.c).isLand ? landVal(out.c) : base(out.c), inV = x.land ? 0 : x.b;
        const synAfter = synTotal(), sfAfter = shortfall(), cpAfter = curvePen(mvSum);
        cnt.set(snap.cnt); rc.splice(0, rc.length, ...snap.rc); mvSum = snap.mv;
        return (inV - outV) + (synAfter - synTotal()) - W.role * 2 * (sfAfter - shortfall()) - (cpAfter - curvePen(mvSum)); };
      for (; rounds < 250 && Date.now() - t0 < timeCap; rounds++) {
        const outs = deck.filter(e => !e.locked && e.qty === 1 && e.slot !== 'combo' && e.slot !== 'include' && !analyze(e.c).isLand);
        const moves = [], blocked = [];
        const BUCKETS = [0.25, 0.5, 1, 2, 4, 8, 16, 32, 64];
        const down = BUCKETS.map(() => []); // per saving bucket: best few (d, out, x) with saving ≥ bucket
        const pushDown = (sv, d, e, x) => { for (let b = 0; b < BUCKETS.length && BUCKETS[b] <= sv; b++) { const L2 = down[b]; if (L2.length < 6 || d > L2[L2.length - 1].d) { L2.push({ d, e, x }); L2.sort((a, b2) => b2.d - a.d); if (L2.length > 6) L2.pop(); } } };
        const curNow = curvePen(mvSum), synNow = synTotal(), sfNow = shortfall();
        const gain = new Float64Array(NP * 2), gainBoth = new Float64Array(NP);
        for (const e of outs) {
          const c = e.c, cs = sides(c), cb = roleBits(c), bc = base(c), pOut = pr(c);
          for (const k of cs) cnt[k] -= 1;
          let gNoC = 0;
          for (let i = 0; i < NP; i++) { const en = cnt[2 * i], pay = cnt[2 * i + 1], g = G(i, en, pay); gNoC += g; gain[2 * i] = G(i, en + 1, pay) - g; gain[2 * i + 1] = G(i, en, pay + 1) - g; gainBoth[i] = G(i, en + 1, pay + 1) - g; }
          for (const k of cs) cnt[k] += 1;
          const lossC = synNow - Wl * gNoC;
          let needMask = 0, openMask = 0;
          ROLES.forEach((r, i) => { if ((cb & (1 << i)) && rc[i] <= tgt[i]) needMask |= 1 << i; if (!(cb & (1 << i)) && rc[i] < tgt[i]) openMask |= 1 << i; });
          const cp = new Map();
          const fixed = -bc - lossC + curNow;
          for (let q = 0; q < cands.length; q++) {
            const x = cands[q]; pairs++;
            if (x.inDeck || (x.rb & needMask) !== needMask) continue; // never open a role shortfall
            let sg = 0; const one = x.one, both = x.both; for (let k = 0; k < one.length; k++) sg += gain[one[k]]; for (let k = 0; k < both.length; k++) sg += gainBoth[both[k]];
            let cpv = cp.get(x.mv); if (cpv === undefined) { cpv = curvePen(mvSum - c.cmc + x.mv); cp.set(x.mv, cpv); }
            const d = x.b + fixed + Wl * sg + W.role * 2 * pc(x.rb & openMask) - cpv;
            if (d > 1e-6) (cap != null && st.total - pOut + x.p > cap + 1e-9 ? blocked : moves).push({ e, x, d });
            if (cap != null && pOut - x.p >= BUCKETS[0]) pushDown(pOut - x.p, d, e, x);
          }
        }
        // nonbasic land → basic as a budget source
        if (cap != null) { const bb = bestBasic(); if (bb) for (const e of deck) if (!e.locked && analyze(e.c).isLand && !isBasic(e.c) && e.qty === 1 && pr(e.c) - pr(bb) >= BUCKETS[0]) pushDown(pr(e.c) - pr(bb), landVal(bb) - landVal(e.c), e, { c: bb, land: true, p: pr(bb) }); }
        // every budget-feasible improving move is tried in order (no cut-off), then the best budget-blocked ones for pairing
        const ord = (a, b) => b.d - a.d || (a.x.c.n < b.x.c.n ? -1 : 1);
        moves.sort(ord); blocked.sort(ord);
        let applied = 0; const usedOut = new Set(), usedIn = new Set();
        for (const m of moves.concat(blocked.slice(0, 300))) {
          if (applied >= 8) break;
          if (usedOut.has(m.e) || usedIn.has(m.x.c.n) || m.x.inDeck || !deck.includes(m.e)) continue;
          if (cmin != null && analyze(m.e.c).creature && !m.x.cr && st.creatures - 1 < cmin) continue;
          const dd = applied ? exactD(m.e, m.x) : m.d; if (dd <= 1e-6) continue;
          const why = canAdd(m.x.c, { replacing: m.e });
          if (!why) { doSwap(m.e, m.x, dd, 'single'); usedOut.add(m.e); usedIn.add(m.x.c.n); applied++; continue; }
          if (why !== 'total budget' || cap == null) continue;
          // pair with a cheaper swap elsewhere so the two together fit the budget and raise J
          const over = st.total - pr(m.e.c) + m.x.p - cap;
          const bi = BUCKETS.findIndex(b => b >= over - 1e-9); if (bi < 0) continue;
          for (const dn of down[bi]) {
            if (dn.e === m.e || dn.x.c === m.x.c || usedOut.has(dn.e) || tabu.has(dn.e.c.n) || !deck.includes(dn.e) || (dn.x.c && !dn.x.land && dn.x.inDeck)) continue;
            if (dd + dn.d <= 1e-6) continue;
            if (!dn.x.land && canAdd(dn.x.c, { replacing: dn.e })) continue;
            if (canAdd(m.x.c, { replacing: m.e, slack: pr(dn.e.c) - dn.x.p })) continue; // other limits (bracket, combos, creatures) still block it
            const d2 = exactD(dn.e, dn.x); if (dd + d2 <= 1e-6) continue;
            // apply both, then keep them only if J really rose (state snapshot makes this exact and reversible)
            const Jb = J(), snap = { deck: deck.map(e => [e, e.qty]), total: st.total, cnt: Object.assign({}, st.cnt), cr: st.creatures, names: new Set(st.names), pc: Float64Array.from(cnt), rc: rc.slice(), mv: mvSum, inD: cands.map(x => x.inDeck), sw: swaps.length };
            doSwap(dn.e, dn.x, d2, 'budget pair');
            const d1 = exactD(m.e, m.x); doSwap(m.e, m.x, d1, 'budget pair');
            if (J() <= Jb + 1e-6 || validBudget() === false) {
              deck.splice(0, deck.length, ...snap.deck.map(([e, q]) => { e.qty = q; return e; })); st.total = snap.total; st.cnt = snap.cnt; st.creatures = snap.cr; st.names = snap.names;
              cnt.set(snap.pc); rc.splice(0, rc.length, ...snap.rc); mvSum = snap.mv; cands.forEach((x, i) => { x.inDeck = snap.inD[i]; }); swaps.length = snap.sw; continue;
            }
            usedOut.add(m.e); usedOut.add(dn.e); usedIn.add(m.x.c.n); tabu.add(m.x.c.n); applied += 2; break;
          }
        }
        if (!applied) break;
      }
      const J1 = J();
      R.optimize = { baseline: J0, final: J1, swaps, pairs, rounds, pool: cands.length, ms: Date.now() - t0, timedOut: Date.now() - t0 >= timeCap };
      L('Optimise: deck score ' + J0.toFixed(1) + ' → ' + J1.toFixed(1) + ' after ' + swaps.length + ' swap(s) in ' + rounds + ' round(s); ' + pairs.toLocaleString() + ' (deck card, pool card) pairs scored across ' + cands.length.toLocaleString() + ' nonland candidates in ' + R.optimize.ms + ' ms' + (R.optimize.timedOut ? ' (time cap reached)' : '; no improving swap left') + '.');
      for (const w of swaps) L('  ' + w.tag + ': ' + w.out + ' → ' + w.in + ' (' + (w.d >= 0 ? '+' : '') + w.d.toFixed(2) + ')');
    }

    /* deck score from scratch for the current list (same J as the optimiser), so edits and history show a comparable number */
    R.deckScore = () => {
      const Wl = W.link != null ? +W.link : 1, tagKeys = new Set(tags.map(t => t.key));
      const cnt = new Float64Array(PAIRS.length * 2);
      const addSides = (c, q) => PAIRS.forEach((p, i) => { if (p.en(c)) cnt[2 * i] += q; if (p.pay(c)) cnt[2 * i + 1] += q; });
      for (const c of cmds) addSides(c, 3);
      let b = 0, mv = 0, n = 0; const rc = {};
      for (const e of deck) { const a = analyze(e.c); if (!isBasic(e.c)) addSides(e.c, e.qty); for (const r of ROLES) if (a.roles[r]) rc[r] = (rc[r] || 0) + 1;
        if (a.isLand) b += isBasic(e.c) ? 0 : landScore(e.c) * e.qty; else { b += base(e.c) * e.qty; mv += e.c.cmc * e.qty; n += e.qty; } }
      let g = 0; PAIRS.forEach((p, i) => { const w = (cmds.some(c => p.en(c) || p.pay(c)) || tagKeys.has(p.key)) ? 1 : 0.35; g += w * 2 * Math.sqrt(cnt[2 * i] * cnt[2 * i + 1]); });
      const sf = ROLES.reduce((s2, r) => s2 + Math.max(0, (+S.targets[r] || 0) - (rc[r] || 0)), 0);
      return b + Wl * g - W.role * 2 * sf - W.curve * 8 * Math.max(0, Math.abs((n ? mv / n : T) - T) - 0.15);
    };

    /* 8. validate + auto-repair */
    R._runBan = new Set();

      for (const x of cands) {
        if (fail.id === 'budget' && cap != null && (price(x.c) || 0) >= (price(victim.c) || 0)) continue;

  /* ---------- validation ---------- */
  async function validate(R, ctx) {
    const { CI, lim, cap, pcap, cur, price, combos, comboForbidden, S, cmin, cmax, excludeSet, cmds } = ctx;
    const rules = [];
    const all = cmds.map(c => ({ c, qty: 1, cmd: true })).concat(R.deck);
    const total = all.reduce((s, e) => s + e.qty, 0);

    const counts = new Map(); for (const e of all) counts.set(e.c, (counts.get(e.c) || 0) + e.qty);

      rules.push({ id: 'budget', label: 'Budget', pass: !overTotal && !overPer.length, detail: 'Total ' + fmt(totalP, cur) + (cap != null ? ' / cap ' + fmt(cap, cur) + (overTotal ? ' (over by ' + fmt(totalP - cap, cur) + ')' : '') : '') + (pcap != null ? '; per-card cap ' + fmt(pcap, cur) + (overPer.length ? ' exceeded by ' + overPer.join(', ') : ' respected') : '') + (unknown.length ? '; ' + unknown.length + ' card(s) without price' : ''), offenders });

  }

    { key: 'blink', label: 'Blink / ETB', en: c => /\bexile [^.]*you control[^.]*\.?[^.]*return (?:it|that card|them|those cards) to the battlefield|\bflicker/.test(c.low), pay: c => analyze(c).creature && /when (?:~|this creature) enters/.test(c.low), enDesc: 'flickers permanents', payDesc: 'creature with enter trigger' },

/* ===== Similar: card-to-card similarity for the card explorer =====

  const pickNewest = files => { const ok = files.filter(f => BULK_RE.test(f.name)); const rank = n => /^oracle/i.test(n) ? 0 : /^default/i.test(n) ? 1 : 2; ok.sort((a, b) => rank(a.name) - rank(b.name) || (a.name < b.name ? 1 : -1)); return ok[0] || null; };
  async function repoFile() {
    if (!window.EDH_SITE || !/^https?:$/.test(location.protocol)) return null;

  async function readCards(res, url, size) {

  async function loadCards() {

  /* ---------- Commander Spellbook combos (data/spellbook/), same files and stored copy as the generator ---------- */

      if (man && man.format !== SB_FORMAT) man = null;
      const stored = await IDB.get('combos');
      const tag = man ? [man.format, man.timestamp, man.variants, man.tables.bytes].concat(man.shards.map(x => x.bytes)).join('|') : null;
      let data = stored && stored.format === SB_FORMAT && (!man || stored.tag === tag) ? stored : null;
      if (!data && man) {
        setStatus('Loading Commander Spellbook combos (' + man.variants.toLocaleString() + ')…');

  function renderSources() {

  /* ---------- formatting ---------- */

  /* ---------- search ---------- */
  let nameIx = null;
  function names() { if (!nameIx && CX.bulk) nameIx = CX.bulk.all.filter(c => c.stype !== 'funny' || c.leg === 'legal').map(c => ({ c, k: Engine.nameKey(c.n) })); return nameIx || []; }
  function setupSearch() {

      const byRank = (a, b) => (a.rank || 1e9) - (b.rank || 1e9);
      items = pre.sort(byRank).concat(sub.sort(byRank)).slice(0, 12); sel = -1;
      if (!items.length) { ul.innerHTML = '<li class="none">No card named like that' + (CX.bulk ? '' : ' (card data still loading)') + '</li>'; ul.classList.remove('hidden'); return; }

      '<li><b>Mana cost</b>: 60% mana value (−25% per point of difference), 40% colour identity overlap.</li>' +
      '<li><b>Type</b>: 70% card types, 20% subtypes, 10% legendary or not.</li>' +
      '<li><b>Stats</b>: power and toughness (−12.5% per point) or loyalty (−20% per point); only for cards that have them.</li>' +
      '<li>The score is the weighted mean of those parts; the bar shows each part\'s share. A focus keeps only cards with that mechanic and adds how alike their lines with it are.</li></ul></details>';
  }
  const BT = { R: 'Ruthless', S: 'Spicy', P: 'Powerful', O: 'Oddball', C: 'Core', E: 'Exhibition', B: 'Banned' };
  function combosHTML(c, K) {
    if (!K) return '<p class="note">' + (CX.combos === null && CX.comboTried ? 'Combo data is not available.' : 'Loading Commander Spellbook combos…') + '</p>';
    if (!K.two.length) return '<p class="note">No 2-card combos with ' + esc(c.n) + ' in Commander Spellbook' + (K.more ? '. It is in ' + K.more.toLocaleString() + ' combos that need 3 or more cards.' : '.') + '</p>' + sbSearch(c);
    const rows = K.two.slice(0, CX.cn || 40).map(({ v, partner }) => {
      const p = Engine.lookup(CX.bulk, partner) || { n: partner, ci: '', mc: '', tl: '', p: {}, img: '' };
      const tot = c.p.usd != null && p.p.usd != null ? c.p.usd + p.p.usd : null;
      const res = v.p.slice(0, 4).map(x => '<span class="chip' + (/infinite/i.test(x) ? ' inf' : '') + '">' + esc(x) + '</span>').join('') + (v.p.length > 4 ? '<span class="note">+' + (v.p.length - 4) + '</span>' : '');
      return '<li class="rec combo"><button type="button" class="thb" data-open="' + esc(p.n) + '" aria-label="Open ' + esc(p.n) + '">' + thumb(p) + '</button>' +
        '<div class="rb"><div class="rt"><span class="plus">+</span>' + openBtn(p) + '<span class="cost">' + manaHTML(p.mc) + '</span></div><div class="sh">' + res + '</div>' +
        (v.t.length ? '<div class="note">Also needs: ' + esc(v.t.join('; ')) + '</div>' : '') + (v.cmd.length ? '<div class="note">Needs ' + esc(v.cmd.join(' and ')) + ' as commander</div>' : '') +
        '<div class="note">' + (BT[v.bt] ? 'Spellbook bracket tag: ' + BT[v.bt] + ' · ' : '') + 'colour identity ' + pipsHTML(v.ci) + (v.pop ? ' · in ' + v.pop.toLocaleString() + ' decks' : '') + ' · <a href="https://commanderspellbook.com/combo/' + encodeURIComponent(v.id) + '/" target="_blank" rel="noopener">Steps ↗</a></div></div>' +
        '<div class="rs"><b>' + usd(p.p.usd) + '</b><span class="note">both ' + usd(tot) + '</span></div></li>';
    }).join('');
    return '<p class="note rhead">' + K.two.length.toLocaleString() + ' Commander Spellbook combos made of ' + esc(c.n) + ' and one other card, most played first' + (K.more ? '; ' + K.more.toLocaleString() + ' more need 3 or more cards' : '') + '.</p><ol class="recs-l">' + rows + '</ol>' +
      (K.two.length > (CX.cn || 40) ? '<button type="button" class="block" id="moreCombo">Show more (' + (K.two.length - (CX.cn || 40)) + ')</button>' : '') + sbSearch(c);
  }
  const sbSearch = c => '<p class="note"><a href="https://commanderspellbook.com/search/?q=' + encodeURIComponent('card:"' + c.n + '"') + '" target="_blank" rel="noopener">All combos with this card on Commander Spellbook ↗</a></p>';

  /* ---------- events ---------- */
  let rT = 0;
  const reRank = (delay) => { clearTimeout(rT); rT = setTimeout(() => { const y = window.scrollY; renderRecs(); window.scrollTo({ top: y }); }, delay || 0); };
  function wire() {
    document.addEventListener('click', e => {
      const o = e.target.closest('[data-open]'); if (o) { e.preventDefault(); go(o.dataset.open); return; }
      const f = e.target.closest('[data-focus]'); if (f) { CX.focus = f.dataset.focus; CX.tab = 'similar'; CX.n = 30; $('cxInfo').innerHTML = infoHTML(CX.card); reRank(); if (f.closest('#cxInfo') && innerWidth < 1100) $('cxRecs').scrollIntoView({ behavior: 'smooth' }); return; }
      const t = e.target.closest('[data-rtab]'); if (t) { CX.tab = t.dataset.rtab; renderRecs(); return; }
      if (e.target.id === 'moreBtn') { CX.n += 30; reRank(); return; }
      if (e.target.id === 'moreCombo') { CX.cn = (CX.cn || 40) + 40; reRank(); return; }
      if (e.target.id === 'wReset') { CX.W = Object.assign({}, W0); CX.wOpen = true; reRank(); return; }
      if (e.target.id === 'flipBtn') { const im = $('bigImg'); if (!im) return; const back = /\/front\//.test(im.src); im.onerror = () => { im.onerror = null; im.src = im.src.replace('/back/', '/front/'); e.target.disabled = true; e.target.title = 'No back face image'; }; im.src = back ? im.src.replace('/front/', '/back/') : im.src.replace('/back/', '/front/'); return; }
    });
    $('cxRecs').addEventListener('change', e => {
      const id = e.target.id;
      if (id === 'fCol') CX.F.colors = e.target.value; else if (id === 'fType') CX.F.type = e.target.value; else if (id === 'fSort') CX.sort = e.target.value;
      else if (id === 'fLegal') CX.F.legal = e.target.checked; else if (id === 'fMax') CX.F.max = e.target.value; else if (e.target.dataset.w) { CX.wOpen = true; }
      else return;
      CX.n = 30; reRank();
    });
    $('cxRecs').addEventListener('input', e => {
      const k = e.target.dataset.w; if (!k) return;
      CX.W[k] = +e.target.value; CX.wOpen = true; const v = $('wv-' + k); if (v) v.textContent = e.target.value; reRank(250);
    });
    $('cxRecs').addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('wts')) CX.wOpen = e.target.open; }, true);
    // a picture that fails to load (offline, blocked) falls back to the text card or the colour block
    document.addEventListener('error', e => {
      const im = e.target; if (!im || im.tagName !== 'IMG') return;
      if (im.id === 'bigImg' && CX.card && /\/front\//.test(im.src)) { const c = CX.card; im.outerHTML = '<div class="faux"><div class="fx-h"><b>' + esc(c.n) + '</b><span>' + manaHTML(c.mc) + '</span></div><div class="fx-t">' + esc(c.tl) + '</div><div class="fx-o">' + oracleHTML(c.ot) + '</div>' + (c.pt ? '<div class="fx-pt">' + esc(c.pt) + '</div>' : '') + '</div>'; }
      else if (im.classList.contains('th')) { const n = im.closest('[data-open]'), c = n && Engine.lookup(CX.bulk, n.dataset.open); im.outerHTML = '<span class="th th-txt" aria-hidden="true">' + pipsHTML(c ? c.ci : '') + '</span>'; }
      else if (im.closest('.st-card')) im.remove();
    }, true);
    window.addEventListener('hashchange', show);
    document.addEventListener('keydown', e => {
      if (e.target.matches && e.target.matches('input,select,textarea')) return;
      if (e.key === '/') { e.preventDefault(); $('q').focus(); }
      else if (e.key === 'Escape') $('appearance').classList.add('hidden');
    });
    // appearance: shared with the deck generator (edhgen.appearance); card pictures default to on here
    let AP = { mode: 'system', accent: '', size: '1', head: 'serif', img: 'off', cimg: 'on' };
    try { AP = Object.assign(AP, JSON.parse(LS.get('edhgen.appearance') || '{}')); } catch (e) { }
    const root = document.documentElement, keys = [['apMode', 'mode'], ['apAccent', 'accent'], ['apSize', 'size'], ['apHead', 'head'], ['apImg', 'cimg']];
    const applyAP = () => {
      if (AP.mode === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', AP.mode);
      if (AP.accent) root.setAttribute('data-accent', AP.accent); else root.removeAttribute('data-accent');
      root.style.setProperty('--fz', AP.size); root.setAttribute('data-headings', AP.head); CX.img = AP.cimg;
      for (const [id, k] of keys) $(id).querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === String(AP[k])));
    };
    applyAP();
    for (const [id, k] of keys) $(id).addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (!b) return; AP[k] = b.dataset.v; applyAP(); LS.set('edhgen.appearance', JSON.stringify(AP)); if (k === 'cimg') render(); });
    $('themeBtn').addEventListener('click', e => { e.stopPropagation(); const p = $('appearance'), open = p.classList.toggle('hidden'); $('themeBtn').setAttribute('aria-expanded', String(!open)); });
    document.addEventListener('click', e => { if (!e.target.closest('.popwrap')) $('appearance').classList.add('hidden'); });
  }

  async function init() {
    wire(); setupSearch(); render();
    await loadCards();
    if (!CX.bulk) { setStatus('No card data. Open this page from the site, or load a file on the deck generator page first.'); $('cxMid').innerHTML = '<div class="panel empty"><h2>No card data</h2><p class="note">This page reads the Scryfall file in the site\'s data folder, or the copy the deck generator stored in this browser.</p></div>'; return; }
    setStatus(''); show();
    const comboP = loadCombos().then(() => { CX.comboTried = true; if (CX.card) { if (CX.tab === 'combos') renderRecs(); else { const b = document.querySelector('[data-rtab="combos"]'); if (b) renderRecs(); } } });
    setStatus('Indexing rules text…');
    CX.X = await Similar.build(CX.bulk, f => setStatus('Indexing rules text… ' + Math.round(f * 100) + '%'));
    setStatus('');
    if (CX.card) { $('cxInfo').innerHTML = infoHTML(CX.card); renderRecs(); }
    await comboP;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</html>
